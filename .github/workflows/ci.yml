name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff
      - name: Lint (ruff)
        run: ruff check rubric tests
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Self-audit (technical pillar only)
        run: rubric audit . --skip-business --skip-community --no-save
