[project]
name = "rubric"
version = "0.6.0"
description = "Comprehensive audit for software projects: technical, thesis, and community pillars + a verdict layer."
requires-python = ">=3.10"
dependencies = [
    "acli-spec>=0.5.0",
    "claude-agent-sdk>=0.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "gitpython>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "markdown>=3.5.0",
    "tiktoken>=0.7.0",
]

[project.scripts]
rubric = "rubric.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rubric*"]
